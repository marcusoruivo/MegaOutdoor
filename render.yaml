services:
  - type: web
    name: megaoutdoor
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/lib/megaoutdoor/data
      - key: UPLOAD_DIR
        value: /var/lib/megaoutdoor/uploads
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_SANDBOX
        sync: false
      - key: MERCADOPAGO_WEBHOOK_URL
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: RESERVA_TTL_MINUTOS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        value: https://milhaodoor.com.br
    disk:
      name: megaoutdoor-data
      mountPath: /var/lib/megaoutdoor
      sizeGB: 1
